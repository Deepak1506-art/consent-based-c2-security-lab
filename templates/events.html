{% extends "base.html" %}
{% block content %}
<h1>Event logs</h1>
<form class="filter" method="get"><label>Severity
<select name="severity">
{% for s in ["ALL","LOW","MEDIUM","HIGH","CRITICAL"] %}<option value="{{ s }}" {% if severity == s %}selected{% endif %}>{{ s }}</option>{% endfor %}
</select></label><button>Filter</button><a href="{{ url_for('export_csv') }}">Export CSV</a></form>
<section class="panel"><div class="table-wrap"><table>
<tr><th>Timestamp (UTC)</th><th>Endpoint</th><th>Event type</th><th>Severity</th><th>Description</th></tr>
{% for e in events %}<tr><td>{{ e.timestamp }}</td><td>{{ e.client_id }}</td><td>{{ e.event_type }}</td>
<td><span class="severity {{ e.severity|lower }}">{{ e.severity }}</span></td><td>{{ e.description }}</td></tr>
{% else %}<tr><td colspan="5">No matching events.</td></tr>{% endfor %}
</table></div></section>
{% endblock %}
